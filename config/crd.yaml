apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: suricatasensors.suricata.yas.ohbmo.com
spec:
  group: suricata.yas.ohbmo.com
  scope: Namespaced
  names:
    plural: suricatasensors
    singular: suricatasensor
    kind: SuricataSensor
    shortNames: [suri]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, capture]
              properties:
                image:
                  type: string
                  minLength: 1
                fileExtraction:
                  type: object
                  required: [claimName, mountPath]
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                    mountPath:
                      type: string
                      minLength: 2
                      pattern: '^/'
                metrics:
                  type: object
                  required: [exporterImage, port]
                  properties:
                    exporterImage:
                      type: string
                      minLength: 1
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    args:
                      type: array
                      items:
                        type: string
                    path:
                      type: string
                      pattern: '^/'
                    serviceMonitor:
                      type: boolean
                      default: false
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                disableChecksumValidation:
                  type: boolean
                  default: false
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 1
                  default: 1
                capture:
                  type: object
                  oneOf:
                    - required: [claimName, file]
                    - required: [interface]
                    - required: [inlineInterfaces]
                  properties:
                    inlineInterfaces:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: string
                        minLength: 1
                        maxLength: 15
                    interface:
                      type: string
                      minLength: 1
                      maxLength: 15
                    xdpVerdictCache:
                      type: object
                      required: [image, ttlSeconds]
                      properties:
                        image:
                          type: string
                          minLength: 1
                        ttlSeconds:
                          type: integer
                          minimum: 1
                          maximum: 300
                    hostNetwork:
                      type: boolean
                      default: false
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    claimName:
                      type: string
                      minLength: 1
                    file:
                      type: string
                      minLength: 1
                configRef:
                  type: object
                  required: [name, key]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
                rulesFileRef:
                  type: object
                  required: [name, key]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
                rulesFileRefs:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [name, key]
                    properties:
                      kind:
                        type: string
                        enum: [ConfigMap, Secret]
                        default: ConfigMap
                      name:
                        type: string
                        minLength: 1
                      key:
                        type: string
                        minLength: 1
                rules:
                  type: object
                  required: [claimName, updateSchedule]
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                    updateSchedule:
                      type: string
                      minLength: 1
