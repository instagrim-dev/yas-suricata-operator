apiVersion: v1
kind: Namespace
metadata:
  name: yas-suricata-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yas-suricata-operator
  namespace: yas-suricata-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yas-suricata-operator
rules:
  - apiGroups: [suricata.yas.ohbmo.com]
    resources: [suricatasensors]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yas-suricata-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yas-suricata-operator
subjects:
  - kind: ServiceAccount
    name: yas-suricata-operator
    namespace: yas-suricata-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yas-suricata-operator
  namespace: yas-suricata-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: yas-suricata-operator}
  template:
    metadata:
      labels: {app: yas-suricata-operator}
    spec:
      serviceAccountName: yas-suricata-operator
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
